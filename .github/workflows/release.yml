# 发布流水线：打 tag（v*）→ 自动打包 AppImage / deb / rpm / Arch pkg / Flatpak
# → 发布 GitHub Release。
#
# 前端是原生 JS（编译期嵌入），没有 npm 构建步骤；Google OAuth 凭据走
# option_env! 注入（仓库不放密钥，CI 编出来是无 OAuth 的诚实构建）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 测试门禁 + Tauri 三件套（AppImage / deb / rpm）────────────────────
  build-tauri:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 系统依赖（webkit2gtk / appindicator）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: cargo test（测试不过不发版）
        run: cargo test --workspace

      - name: Tauri 打包 + 创建 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Mailway v__VERSION__
          releaseBody: |
            Mailway v__VERSION__ —— 原生 Wayland 邮件客户端

            **打包产物**
            - AppImage / deb / rpm（Tauri bundler）
            - Arch Linux：mailway-*-x86_64.pkg.tar.zst
            - Flatpak：org.mailway.app.flatpak

            完整变更见提交历史。
          releaseDraft: false
          prerelease: false
          includeDebug: false

  # ── Arch Linux pkg（makepkg）────────────────────────────────────────
  build-arch-pkg:
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - name: 安装构建依赖
        run: |
          pacman -Syu --noconfirm --needed rust webkit2gtk-4.1 gtk3 \
            libayatana-appindicator openssl sqlite pkgconf
          useradd -m builder && chown -R builder /work 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: makepkg
        run: |
          chmod -R a+rw .
          su builder -c 'cd packaging/arch && makepkg -sf --noconfirm'

      - name: 附加到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/arch/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Flatpak bundle（gnome 运行时，webkitgtk 由运行时提供）────────────
  build-flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: 编译 release 二进制
        run: cargo build --release --locked -p mailway

      - name: 装箱 .flatpak
        run: |
          chmod +x packaging/flatpak/build-flatpak.sh
          ./packaging/flatpak/build-flatpak.sh target/release/mailway org.mailway.app.flatpak

      - name: 附加到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: org.mailway.app.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
