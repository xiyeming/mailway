[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.0.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/xiyeming/mailway"

[workspace.dependencies]
# 异步
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "fs"] }
futures = "0.3"

# 错误 / 日志
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 邮件
mailparse = "0.15"
imap = "2"
# imap 的 TLS 后端；我们自己构造 TlsConnector，所以直接依赖
native-tls = "0.2"

# 存储。chrono feature 提供 DateTime<Utc> 的 ToSql/FromSql（孤儿规则下不能自己 impl）
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# HTML 净化：邮件正文是不可信输入，这一层是安全边界
ammonia = "4"

# 字符集（mailparse 会用到）
encoding_rs = "0.8"

# 内嵌图片 cid: → data: URI 用
base64 = "0.22"
ureq = "2"

[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }

# imap-proto 0.10.2 不认识 RFC 2971 的 `* ID (...)` 无标签行，会把 imap crate
# 的响应读循环打崩；vendor 一份加了兜底解析（见 vendor/imap-proto/PATCH-NOTES.md）。

[profile.dev]
incremental = true
